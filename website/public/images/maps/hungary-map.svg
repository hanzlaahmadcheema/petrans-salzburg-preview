<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="70%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A10" />
    </radialGradient>

    <!-- Metallic Gold Map Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C25B" />
      <stop offset="30%" stop-color="#CAA328" />
      <stop offset="70%" stop-color="#8C6D1F" />
      <stop offset="100%" stop-color="#5E4712" />
    </linearGradient>

    <!-- Inner Land Gradient -->
    <radialGradient id="landGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24314A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#131B29" stop-opacity="0.95" />
    </radialGradient>

    <!-- Golden Filter Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="landShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(202, 163, 40, 0.05)" stroke-width="0.8" />
      <circle cx="40" cy="40" r="1" fill="rgba(202, 163, 40, 0.15)" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#bgGlow)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Outer Luxury Border -->
  <rect x="18" y="18" width="764" height="564" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.65" />
  <rect x="24" y="24" width="752" height="552" rx="10" fill="none" stroke="rgba(202, 163, 40, 0.25)" stroke-width="0.8" stroke-dasharray="8,6" />

  <!-- Geographic Land Mass Silhouette -->
  <g filter="url(#landShadow)">
    <path d="M 210,230 C 320,200 460,190 590,210 C 660,230 670,300 640,360 C 580,420 480,430 370,430 C 260,420 200,380 180,320 C 170,270 180,240 210,230 Z" fill="url(#landGlow)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />
    <!-- Secondary Inner Accent Line -->
    <path d="M 210,230 C 320,200 460,190 590,210 C 660,230 670,300 640,360 C 580,420 480,430 370,430 C 260,420 200,380 180,320 C 170,270 180,240 210,230 Z" fill="none" stroke="rgba(230, 194, 91, 0.35)" stroke-width="1" transform="scale(0.97) translate(12, 10)" />
  </g>

  <!-- VIP Chauffeur Route Network -->
  
    <line x1="280" y1="260" x2="410" y2="270" 
          stroke="#E6C25B" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" filter="url(#goldGlow)" />
  

    <line x1="410" y1="270" x2="395" y2="235" 
          stroke="#E6C25B" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" filter="url(#goldGlow)" />
  

    <line x1="410" y1="270" x2="510" y2="240" 
          stroke="#E6C25B" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" filter="url(#goldGlow)" />
  

    <line x1="410" y1="270" x2="300" y2="340" 
          stroke="#E6C25B" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" filter="url(#goldGlow)" />
  

  <!-- Cities and Pinpoints -->
  
    <g transform="translate(410, 270)" class="city-pin">
      <circle r="14" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="6" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="3" fill="#0B0F19" />
      <rect x="10" y="-12" width="202.6" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Budapest (Danube Pearl)</text>
    </g>
  

    <g transform="translate(300, 340)" class="city-pin">
      <circle r="10" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="4.5" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="2" fill="#0B0F19" />
      <rect x="10" y="-12" width="112.39999999999999" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Lake Balaton</text>
    </g>
  

    <g transform="translate(395, 235)" class="city-pin">
      <circle r="10" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="4.5" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="2" fill="#0B0F19" />
      <rect x="10" y="-12" width="194.39999999999998" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Visegrád & Danube Bend</text>
    </g>
  

    <g transform="translate(510, 240)" class="city-pin">
      <circle r="10" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="4.5" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="2" fill="#0B0F19" />
      <rect x="10" y="-12" width="145.2" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Eger Wine Region</text>
    </g>
  

    <g transform="translate(280, 260)" class="city-pin">
      <circle r="10" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="4.5" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="2" fill="#0B0F19" />
      <rect x="10" y="-12" width="46.8" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Győr</text>
    </g>
  

  <!-- Header Branding & Typography -->
  <g transform="translate(48, 64)">
    <rect x="-10" y="-18" width="340" height="74" rx="8" fill="#0B0F19" fill-opacity="0.85" stroke="rgba(202, 163, 40, 0.3)" stroke-width="1" />
    <text x="0" y="4" fill="#CAA328" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="700" letter-spacing="3">HUNGARY</text>
    <text x="0" y="26" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="0.8">Magyarország</text>
    <text x="0" y="44" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" font-style="italic">Danube Palaces, Thermal Baths & Historic Vineyards</text>
  </g>

  <!-- Watermark / Footer Badge -->
  <g transform="translate(48, 545)">
    <text x="0" y="0" fill="#CAA328" font-family="'Space Grotesk', monospace" font-size="11" font-weight="600" letter-spacing="2" opacity="0.9">PETRANS VIP EUROPEAN CORRIDOR</text>
    <text x="0" y="15" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">SALZBURG BASE • MERCEDES-BENZ FLEET • ALL TOLLS INCLUDED</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(720, 80)" opacity="0.85">
    <circle r="22" fill="none" stroke="#CAA328" stroke-width="1" opacity="0.4" />
    <circle r="18" fill="none" stroke="#CAA328" stroke-width="0.7" stroke-dasharray="3,3" />
    <path d="M 0,-18 L 4,-4 L 18,0 L 4,4 L 0,18 L -4,4 L -18,0 L -4,-4 Z" fill="url(#goldGrad)" />
    <text x="-4" y="-22" fill="#E6C25B" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">N</text>
  </g>
</svg>