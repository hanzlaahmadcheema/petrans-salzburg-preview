<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="70%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A10" />
    </radialGradient>

    <!-- Metallic Gold Map Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C25B" />
      <stop offset="30%" stop-color="#CAA328" />
      <stop offset="70%" stop-color="#8C6D1F" />
      <stop offset="100%" stop-color="#5E4712" />
    </linearGradient>

    <!-- Inner Land Gradient -->
    <radialGradient id="landGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24314A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#131B29" stop-opacity="0.95" />
    </radialGradient>

    <!-- Golden Filter Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="landShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(202, 163, 40, 0.05)" stroke-width="0.8" />
      <circle cx="40" cy="40" r="1" fill="rgba(202, 163, 40, 0.15)" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#bgGlow)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Outer Luxury Border -->
  <rect x="18" y="18" width="764" height="564" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.65" />
  <rect x="24" y="24" width="752" height="552" rx="10" fill="none" stroke="rgba(202, 163, 40, 0.25)" stroke-width="0.8" stroke-dasharray="8,6" />

  <!-- Geographic Land Mass Silhouette -->
  <g filter="url(#landShadow)">
    <path d="M 350,140 C 420,140 450,180 460,250 C 470,320 480,400 450,470 C 420,510 370,510 340,470 C 320,410 320,320 330,240 C 330,180 340,150 350,140 Z" fill="url(#landGlow)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />
    <!-- Secondary Inner Accent Line -->
    <path d="M 350,140 C 420,140 450,180 460,250 C 470,320 480,400 450,470 C 420,510 370,510 340,470 C 320,410 320,320 330,240 C 330,180 340,150 350,140 Z" fill="none" stroke="rgba(230, 194, 91, 0.35)" stroke-width="1" transform="scale(0.97) translate(12, 10)" />
  </g>

  <!-- VIP Chauffeur Route Network -->
  
    <line x1="385" y1="220" x2="390" y2="290" 
          stroke="#E6C25B" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" filter="url(#goldGlow)" />
  

    <line x1="390" y1="290" x2="400" y2="330" 
          stroke="#E6C25B" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" filter="url(#goldGlow)" />
  

    <line x1="400" y1="330" x2="430" y2="360" 
          stroke="#E6C25B" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" filter="url(#goldGlow)" />
  

    <line x1="390" y1="290" x2="380" y2="440" 
          stroke="#E6C25B" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85" filter="url(#goldGlow)" />
  

  <!-- Cities and Pinpoints -->
  
    <g transform="translate(390, 290)" class="city-pin">
      <circle r="14" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="6" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="3" fill="#0B0F19" />
      <rect x="10" y="-12" width="210.79999999999998" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Vaduz (Capital & Castle)</text>
    </g>
  

    <g transform="translate(385, 220)" class="city-pin">
      <circle r="10" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="4.5" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="2" fill="#0B0F19" />
      <rect x="10" y="-12" width="63.199999999999996" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Schaan</text>
    </g>
  

    <g transform="translate(380, 440)" class="city-pin">
      <circle r="10" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="4.5" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="2" fill="#0B0F19" />
      <rect x="10" y="-12" width="227.2" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Balzers & Gutenberg Castle</text>
    </g>
  

    <g transform="translate(430, 360)" class="city-pin">
      <circle r="10" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="4.5" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="2" fill="#0B0F19" />
      <rect x="10" y="-12" width="178" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Malbun Alpine Resort</text>
    </g>
  

    <g transform="translate(400, 330)" class="city-pin">
      <circle r="10" fill="none" stroke="#CAA328" stroke-width="1.5" opacity="0.4" class="ping-circle" />
      <circle r="4.5" fill="#E6C25B" filter="url(#goldGlow)" />
      <circle r="2" fill="#0B0F19" />
      <rect x="10" y="-12" width="104.19999999999999" height="22" rx="4" fill="#0B0F19" fill-opacity="0.88" stroke="#CAA328" stroke-width="0.8" />
      <text x="17" y="3" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Triesenberg</text>
    </g>
  

  <!-- Header Branding & Typography -->
  <g transform="translate(48, 64)">
    <rect x="-10" y="-18" width="340" height="74" rx="8" fill="#0B0F19" fill-opacity="0.85" stroke="rgba(202, 163, 40, 0.3)" stroke-width="1" />
    <text x="0" y="4" fill="#CAA328" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="700" letter-spacing="3">LIECHTENSTEIN</text>
    <text x="0" y="26" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="0.8">Fürstentum Liechtenstein</text>
    <text x="0" y="44" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" font-style="italic">Sovereign Alpine Principality in the Rhine Valley</text>
  </g>

  <!-- Watermark / Footer Badge -->
  <g transform="translate(48, 545)">
    <text x="0" y="0" fill="#CAA328" font-family="'Space Grotesk', monospace" font-size="11" font-weight="600" letter-spacing="2" opacity="0.9">PETRANS VIP EUROPEAN CORRIDOR</text>
    <text x="0" y="15" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">SALZBURG BASE • MERCEDES-BENZ FLEET • ALL TOLLS INCLUDED</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(720, 80)" opacity="0.85">
    <circle r="22" fill="none" stroke="#CAA328" stroke-width="1" opacity="0.4" />
    <circle r="18" fill="none" stroke="#CAA328" stroke-width="0.7" stroke-dasharray="3,3" />
    <path d="M 0,-18 L 4,-4 L 18,0 L 4,4 L 0,18 L -4,4 L -18,0 L -4,-4 Z" fill="url(#goldGrad)" />
    <text x="-4" y="-22" fill="#E6C25B" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">N</text>
  </g>
</svg>